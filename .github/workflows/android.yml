name: Android

# Validates the game (the Validate workflow), then exports a debug-signed
# Android APK with the pinned Godot and its checksum-verified export
# templates, verifies it (structure, package id, version, ABI, signature,
# packaged content, no secrets) and uploads the APK with its reports.
# Finally the game is installed on an Android 15 emulator (KVM,
# checksum-verified official packages) and played with real touch input:
# title screen, new claim, tutorial, camera, pause menu, Back key, autosaves,
# background/resume - failing on any crash, ANR or engine error. Two builds
# are played: the shipped arm64-v8a APK (through the emulator's ARM
# translation) and its x86_64 twin (same preset, native on the emulator;
# tools/apk/compare_content.py proves every non-native-library file of the
# two APKs is identical).
# The debug keystore is created fresh for every run and never stored.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  apk:
    name: Build and verify the APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare the game project
        uses: ./.github/actions/prepare-game

      - name: Cache the Android SDK and export templates
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.TOOLS_DIR }}/android-sdk
            ${{ env.TOOLS_DIR }}/godot-templates
          key: android-sdk-bt35.0.0-pt37.0.1-templates-4.7.2-${{ hashFiles('tools/ci/install_android_sdk.sh', 'tools/ci/install_godot_templates.sh') }}

      - name: Install the Android SDK (verified)
        run: echo "ANDROID_SDK=$(tools/ci/install_android_sdk.sh "$TOOLS_DIR/android-sdk")" >> "$GITHUB_ENV"

      - name: Install the Godot export templates (verified)
        run: tools/ci/install_godot_templates.sh "$TOOLS_DIR/godot-templates"

      - name: Configure Godot for Android export
        run: |
          java_home="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          test -x "$java_home/bin/java"
          keystore="$RUNNER_TEMP/debug.keystore"
          "$java_home/bin/keytool" -genkeypair -keystore "$keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          python tools/ci/configure_godot_android.py --sdk "$ANDROID_SDK" --java "$java_home" --debug-keystore "$keystore"

      - name: Export the debug APK and its x86_64 twin for the emulator
        run: |
          mkdir -p build/apk
          "$GODOT" --headless --path . --export-debug "Android" build/apk/MinerMania3D-debug.apk 2>&1 | tee build/apk/export.log
          test -s build/apk/MinerMania3D-debug.apk
          python tools/apk/add_emulator_preset.py
          "$GODOT" --headless --path . --export-debug "Android x86_64 (emulator test)" \
            build/apk/MinerMania3D-x86_64-emulator.apk 2>&1 | tee build/apk/export_x86_64.log
          git checkout -- export_presets.cfg
          test -s build/apk/MinerMania3D-x86_64-emulator.apk

      - name: Verify the APK
        run: |
          python tools/apk/verify_apk.py build/apk/MinerMania3D-debug.apk --sdk "$ANDROID_SDK" \
            --report build/apk/apk_report.json --manifest build/apk/apk_manifest.json | tee build/apk/verify.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android APK"
            echo ""
            if [[ -f build/apk/apk_report.json ]]; then
              python - <<'PY'
          import json
          r = json.load(open("build/apk/apk_report.json"))
          print(f"- **{r.get('package','?')}** {r.get('version_name','?')} ({r.get('version_code','?')}), {r.get('size_mb','?')} MB, ABI {', '.join(r.get('abis', []))}")
          print(f"- min SDK {r.get('min_sdk','?')}, target SDK {r.get('target_sdk','?')}, signed by `{r.get('signer','?')}`")
          print(f"- verification: {'PASSED' if r.get('passed') else 'FAILED'}")
          print(f"- size by kind (MB): {r.get('size_by_kind_mb', {})}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: MinerMania3D-debug-apk
          path: build/apk/MinerMania3D-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prove the x86_64 twin carries the same game
        run: |
          python tools/apk/compare_content.py build/apk/MinerMania3D-debug.apk \
            build/apk/MinerMania3D-x86_64-emulator.apk --report build/apk/content_compare.json

      - name: Upload the x86_64 twin
        uses: actions/upload-artifact@v7
        with:
          name: MinerMania3D-x86_64-emulator-apk
          path: build/apk/MinerMania3D-x86_64-emulator.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload APK reports and logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: apk-reports
          path: |
            build/apk/apk_report.json
            build/apk/apk_manifest.json
            build/apk/content_compare.json
            build/apk/export.log
            build/apk/export_x86_64.log
            build/apk/verify.log
            build/godot_import.log
            assets/generated/catalog.json
            assets/manifests/asset_manifest.json
          if-no-files-found: warn
          retention-days: 30

  device:
    name: Play on an Android emulator (${{ matrix.name }})
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shipped arm64-v8a APK
            key: arm64
            artifact: MinerMania3D-debug-apk
            apk: MinerMania3D-debug.apk
          - name: x86_64 twin
            key: x86_64
            artifact: MinerMania3D-x86_64-emulator-apk
            apk: MinerMania3D-x86_64-emulator.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the APK built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${{ matrix.artifact }}" --dir build/apk
          test -s "build/apk/${{ matrix.apk }}"
          sha256sum "build/apk/${{ matrix.apk }}"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install system libraries for the emulator
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpulse0

      - name: Install adb, the emulator and the system image (verified)
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          tools/ci/install_android_sdk.sh "$sdk" >/dev/null
          tools/ci/install_android_emulator.sh "$sdk"
          echo "ANDROID_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Boot the emulator (Android 15, 720x1280)
        run: tools/ci/start_android_emulator.sh "$ANDROID_SDK" build/device 600

      - name: Play the game (touch, gameplay, lifecycle)
        run: |
          python3 tools/device/device_smoke.py --apk "build/apk/${{ matrix.apk }}" --sdk "$ANDROID_SDK" \
            --out build/device --label "${{ matrix.name }}"

      - name: Summary
        if: always()
        run: |
          if [[ -f build/device/device_report.md ]]; then
            cat build/device/device_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### On-device test (${{ matrix.name }}): did not run (see the job log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload device test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: device-test-${{ matrix.key }}
          path: build/device
          if-no-files-found: warn
          retention-days: 30
