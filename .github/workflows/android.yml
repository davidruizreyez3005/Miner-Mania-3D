name: Android

# Validates the game (the Validate workflow), then exports a debug-signed
# Android APK with the pinned Godot and its checksum-verified export
# templates, verifies it (structure, package id, version, ABI, signature,
# packaged content, no secrets) and uploads the APK with its reports.
# Finally the game is installed on an Android 15 emulator (KVM,
# checksum-verified official packages, software graphics) and played with
# real touch input: title screen, new claim, tutorial, camera, pause menu,
# Back key, autosaves, background/resume - failing on any crash, ANR or
# engine error; the first launch must pick the Low graphics preset there.
# Played: the shipped arm64-v8a APK (through the emulator's ARM
# translation) on the OpenGL ES fallback, and its x86_64 twin on Vulkan
# (same preset, native on the emulator, without Android frame pacing, which
# the emulator's virtual GPU cannot present with;
# tools/apk/compare_content.py proves every file outside the native
# libraries is identical to the shipped APK).
# Updates keep the player's save: Android installs an APK over the
# installed game (keeping its data) only when it is signed with the same key
# and its version code does not go down. Every build is therefore signed with
# the update key (tools/ci/update_key.sh: derived from the repository secret
# ANDROID_UPDATE_SEED, or a keystore of your own in ANDROID_KEYSTORE_BASE64 /
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS; the release workflow uses
# the same key - docs/android_signing.md) and its version code comes from the
# commit time (tools/apk/set_version.py). Without a key secret a one-off key
# is used and the run says loudly that the APK cannot update an earlier
# install. The device test installs the APK over the running game and, when
# the previous successful build of the branch carries the same key, updates
# that build with a saved claim to this one: the claim must still be there.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  apk:
    name: Build and verify the APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare the game project
        uses: ./.github/actions/prepare-game

      - name: Cache the Android SDK and export templates
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.TOOLS_DIR }}/android-sdk
            ${{ env.TOOLS_DIR }}/godot-templates
          key: android-sdk-bt35.0.0-pt37.0.1-templates-4.7.2-${{ hashFiles('tools/ci/install_android_sdk.sh', 'tools/ci/install_godot_templates.sh') }}

      - name: Install the Android SDK (verified)
        run: echo "ANDROID_SDK=$(tools/ci/install_android_sdk.sh "$TOOLS_DIR/android-sdk")" >> "$GITHUB_ENV"

      - name: Install the Godot export templates (verified)
        run: tools/ci/install_godot_templates.sh "$TOOLS_DIR/godot-templates"

      - name: Stamp the version (the code rises with every commit)
        run: python tools/apk/set_version.py --github-env

      - name: Signing key (the update key from the repository secrets, else a one-off key)
        env:
          ANDROID_UPDATE_SEED: ${{ secrets.ANDROID_UPDATE_SEED }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          java_home="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          test -x "$java_home/bin/java"
          python tools/apk/update_key.py --self-test
          if tools/ci/update_key.sh "$RUNNER_TEMP/update.p12"; then
            python tools/ci/configure_godot_android.py --sdk "$ANDROID_SDK" --java "$java_home"
          else
            rc=$?
            [[ $rc -eq 3 ]] || exit $rc
            keystore="$RUNNER_TEMP/debug.keystore"
            "$java_home/bin/keytool" -genkeypair -keystore "$keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US" -noprompt
            python tools/ci/configure_godot_android.py --sdk "$ANDROID_SDK" --java "$java_home" --debug-keystore "$keystore"
            echo "SIGNING=one-off" >> "$GITHUB_ENV"
            echo "::warning title=This APK cannot update an earlier install::It is signed with a one-off key. Add the repository secret ANDROID_UPDATE_SEED - a random password of 20 or more characters (docs/android_signing.md): every build is then signed with the same key and installs over the previous one, keeping the save."
          fi

      - name: Export the debug APK and its x86_64 twin for the emulator
        env:
          # The update key (empty with a one-off key: Godot then uses the
          # editor's debug keystore configured above). Not verbose: Godot only
          # redacts signing credentials from verbose logs of release exports.
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.UPDATE_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ env.UPDATE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.UPDATE_KEY_PASSWORD }}
        run: |
          mkdir -p build/apk
          "$GODOT" --headless --path . --export-debug "Android" build/apk/MinerMania3D-debug.apk 2>&1 | tee build/apk/export.log
          test -s build/apk/MinerMania3D-debug.apk
          python tools/apk/add_emulator_preset.py
          "$GODOT" --headless --path . --export-debug "Android x86_64 (emulator test)" \
            build/apk/MinerMania3D-x86_64-emulator.apk 2>&1 | tee build/apk/export_x86_64.log
          git checkout -- export_presets.cfg
          test -s build/apk/MinerMania3D-x86_64-emulator.apk
          [[ -z "${UPDATE_KEYSTORE:-}" ]] || rm -f "$UPDATE_KEYSTORE"

      - name: Verify the APK (version, update key, no secrets inside or in the logs)
        env:
          SECRET_VALUES: |
            ${{ secrets.ANDROID_UPDATE_SEED }}
            ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ${{ env.UPDATE_KEY_PASSWORD }}
        run: |
          python tools/apk/verify_apk.py build/apk/MinerMania3D-debug.apk --sdk "$ANDROID_SDK" \
            --expect-version-code "$APK_VERSION_CODE" --expect-version-name "$APK_VERSION_NAME" \
            ${SIGNING_CERT_SHA256:+--expect-cert-sha256 "$SIGNING_CERT_SHA256"} \
            --report build/apk/apk_report.json --manifest build/apk/apk_manifest.json | tee build/apk/verify.log
          # The export logs are uploaded: they must not carry the signing secrets.
          python - <<'PY'
          import os, pathlib, sys
          values = [v.strip() for v in os.environ.get("SECRET_VALUES", "").splitlines() if len(v.strip()) >= 4]
          leaked = [p.name for p in pathlib.Path("build/apk").glob("*.log")
                    if any(v in p.read_text(errors="replace") for v in values)]
          for name in leaked:
              (pathlib.Path("build/apk") / name).unlink()
          if leaked:
              print(f"::error title=Signing secret in an export log::removed {leaked}")
              sys.exit(1)
          print(f"export logs checked for {len(values)} secret values: clean")
          PY
          echo "UPDATE_KEY_PASSWORD=" >> "$GITHUB_ENV"     # the keystore is gone; so is its password

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android APK"
            echo ""
            if [[ -f build/apk/apk_report.json ]]; then
              python - <<'PY'
          import json
          import os
          r = json.load(open("build/apk/apk_report.json"))
          print(f"- **{r.get('package','?')}** {r.get('version_name','?')} ({r.get('version_code','?')}), {r.get('size_mb','?')} MB, ABI {', '.join(r.get('abis', []))}")
          print(f"- min SDK {r.get('min_sdk','?')}, target SDK {r.get('target_sdk','?')}, signed by `{r.get('signer','?')}`")
          cert = r.get("cert_sha256", "")
          if os.environ.get("SIGNING") == "update":
              src = "ANDROID_UPDATE_SEED" if os.environ.get("SIGNING_SOURCE") == "seed" else "the keystore secrets"
              print(f"- signed with the **update key** from {src} (certificate SHA-256 `{cert}`): installs over earlier builds with this key, keeping the save")
          else:
              print(f"- **signed with a one-off key** (`{cert[:16]}...`): this APK cannot be installed over an earlier build - uninstalling first deletes the save. "
                    "Add the repository secret ANDROID_UPDATE_SEED (docs/android_signing.md).")
          print(f"- verification: {'PASSED' if r.get('passed') else 'FAILED'}")
          print(f"- size by kind (MB): {r.get('size_by_kind_mb', {})}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: MinerMania3D-debug-apk
          path: build/apk/MinerMania3D-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prove the x86_64 twin carries the same game
        run: |
          python tools/apk/compare_content.py build/apk/MinerMania3D-debug.apk \
            build/apk/MinerMania3D-x86_64-emulator.apk --report build/apk/content_compare.json

      - name: Upload the x86_64 twin
        uses: actions/upload-artifact@v7
        with:
          name: MinerMania3D-x86_64-emulator-apk
          path: build/apk/MinerMania3D-x86_64-emulator.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload APK reports and logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: apk-reports
          path: |
            build/apk/apk_report.json
            build/apk/apk_manifest.json
            build/apk/content_compare.json
            build/apk/export.log
            build/apk/export_x86_64.log
            build/apk/verify.log
            build/godot_import.log
            assets/generated/catalog.json
            assets/manifests/asset_manifest.json
          if-no-files-found: warn
          retention-days: 30

  device:
    name: Play on an Android emulator (${{ matrix.name }})
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    # Phones get Android frame pacing (Swappy) on Vulkan; the emulator's
    # virtual Vulkan GPU cannot present with it, so the Vulkan run uses the
    # x86_64 twin (pacing off for x86_64 builds, project.godot) and the
    # shipped APK plays its OpenGL ES path (no Swappy there).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 twin, Vulkan
            key: x86_64-vulkan
            artifact: MinerMania3D-x86_64-emulator-apk
            apk: MinerMania3D-x86_64-emulator.apk
            graphics: lavapipe
            driver: vulkan
          - name: shipped arm64-v8a APK, OpenGL ES fallback
            key: arm64-gles
            artifact: MinerMania3D-debug-apk
            apk: MinerMania3D-debug.apk
            graphics: gles
            driver: opengl3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the APK built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${{ matrix.artifact }}" --dir build/apk
          test -s "build/apk/${{ matrix.apk }}"
          sha256sum "build/apk/${{ matrix.apk }}"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install system libraries for the emulator
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpulse0

      - name: Install adb, the emulator and the system image (verified)
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          tools/ci/install_android_sdk.sh "$sdk" >/dev/null
          tools/ci/install_android_emulator.sh "$sdk"
          echo "ANDROID_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Find the previous build signed with the same key (update test)
        if: matrix.key == 'arm64-gles'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer=$(ls "$ANDROID_SDK"/build-tools/*/apksigner | tail -1)
          cert() { "$signer" verify --print-certs "$1" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          now=$(cert "build/apk/${{ matrix.apk }}")
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 10 --json databaseId --jq ".[].databaseId" | grep -v "^$GITHUB_RUN_ID\$" | head -1 || true)
          note=""
          if [[ -z "$prev" ]]; then
            note="no earlier successful build on this branch"
          elif ! gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name MinerMania3D-debug-apk --dir build/previous; then
            note="the APK of run $prev is no longer available"
          elif [[ "$(cert build/previous/MinerMania3D-debug.apk)" != "$now" ]]; then
            note="run $prev was signed with a different key (the update key secrets were not set then)"
          else
            echo "PREVIOUS_APK=build/previous/MinerMania3D-debug.apk" >> "$GITHUB_ENV"
            note="updating the build of run $prev"
          fi
          echo "Update test: $note"
          echo "UPDATE_NOTE=$note" >> "$GITHUB_ENV"

      - name: Boot the emulator (Android 15, 720x1280, ${{ matrix.graphics }})
        run: tools/ci/start_android_emulator.sh "$ANDROID_SDK" build/device 600 "${{ matrix.graphics }}"

      - name: Play the game (update from the previous build, touch, gameplay, lifecycle, reinstall)
        run: |
          python3 tools/device/device_smoke.py --apk "build/apk/${{ matrix.apk }}" --sdk "$ANDROID_SDK" \
            --out build/device --label "${{ matrix.name }}" --expect-driver "${{ matrix.driver }}" --slow 3 \
            --expect-graphics Low ${PREVIOUS_APK:+--previous-apk "$PREVIOUS_APK"}

      - name: Summary
        if: always()
        run: |
          if [[ -f build/device/device_report.md ]]; then
            cat build/device/device_report.md >> "$GITHUB_STEP_SUMMARY"
            [[ -z "${UPDATE_NOTE:-}" ]] || echo "- update from the previous build: ${UPDATE_NOTE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### On-device test (${{ matrix.name }}): did not run (see the job log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload device test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: device-test-${{ matrix.key }}
          path: build/device
          if-no-files-found: warn
          retention-days: 30
