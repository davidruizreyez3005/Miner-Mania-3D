name: Release

# Builds a release-signed APK for a version tag (v1.2.3) or on demand and
# attaches it to a GitHub release. It is signed with the update key the
# Android workflow signs every build with (tools/ci/update_key.sh), which
# comes only from GitHub Secrets and is never written to the repository or
# printed:
#
#   ANDROID_UPDATE_SEED       a random password the key is derived from, or
#   ANDROID_KEYSTORE_BASE64   a keystore of your own (base64)
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           its key alias
#
# The keystore lives in the runner's temp directory for the export only; the
# password reaches Godot through its GODOT_ANDROID_KEYSTORE_RELEASE_*
# environment variables, and the APK is scanned to prove none of it leaked.
# The version code comes from the commit, so a release installs over any
# earlier build and keeps its save (docs/android_signing.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Signed release APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Signing key (the update key from the repository secrets)
        env:
          ANDROID_UPDATE_SEED: ${{ secrets.ANDROID_UPDATE_SEED }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python tools/apk/update_key.py --self-test
          rc=0
          tools/ci/update_key.sh "$RUNNER_TEMP/release.p12" || rc=$?
          [[ $rc -ne 3 ]] || echo "::error title=Release signing not configured::Add the repository secret ANDROID_UPDATE_SEED (docs/android_signing.md)"
          [[ $rc -eq 0 ]] || exit 1

      - name: Prepare the game project
        uses: ./.github/actions/prepare-game

      - name: Cache the Android SDK and export templates
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.TOOLS_DIR }}/android-sdk
            ${{ env.TOOLS_DIR }}/godot-templates
          key: android-sdk-bt35.0.0-pt37.0.1-templates-4.7.2-${{ hashFiles('tools/ci/install_android_sdk.sh', 'tools/ci/install_godot_templates.sh') }}

      - name: Install the Android SDK and export templates (verified)
        run: |
          echo "ANDROID_SDK=$(tools/ci/install_android_sdk.sh "$TOOLS_DIR/android-sdk")" >> "$GITHUB_ENV"
          tools/ci/install_godot_templates.sh "$TOOLS_DIR/godot-templates"

      - name: Set the version
        run: |
          name="${VERSION_NAME#v}"
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$name' is not semantic (x.y.z)"; exit 1; }
          # The version code comes from the commit (as for every CI build), so
          # a release installs over any earlier build and keeps its save.
          python tools/apk/set_version.py --name "$name" --github-env
          sed -i "s/^config\/version=.*/config\/version=\"$name\"/" project.godot
          echo "APP_VERSION=$name" >> "$GITHUB_ENV"

      - name: Export the signed release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.UPDATE_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.UPDATE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.UPDATE_KEY_PASSWORD }}
        run: |
          java_home="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          python tools/ci/configure_godot_android.py --sdk "$ANDROID_SDK" --java "$java_home"
          mkdir -p build/apk
          "$GODOT" --headless --path . --export-release "Android" "build/apk/MinerMania3D-$APP_VERSION.apk" > build/apk/export.log 2>&1 \
            || { rm -f "$UPDATE_KEYSTORE"; cat build/apk/export.log; exit 1; }
          rm -f "$UPDATE_KEYSTORE"
          test -s "build/apk/MinerMania3D-$APP_VERSION.apk"

      - name: Verify the release APK (update key, version, leak scan for the signing secrets)
        env:
          SECRET_VALUES: |
            ${{ secrets.ANDROID_UPDATE_SEED }}
            ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ${{ env.UPDATE_KEY_PASSWORD }}
        run: |
          python tools/apk/verify_apk.py "build/apk/MinerMania3D-$APP_VERSION.apk" --sdk "$ANDROID_SDK" --expect-release \
            --expect-version-code "$APK_VERSION_CODE" --expect-version-name "$APK_VERSION_NAME" \
            --expect-cert-sha256 "$SIGNING_CERT_SHA256" \
            --report build/apk/apk_report.json --manifest build/apk/apk_manifest.json
          python - <<'PY'
          import os, pathlib, sys
          values = [v.strip() for v in os.environ.get("SECRET_VALUES", "").splitlines() if len(v.strip()) >= 4]
          log = pathlib.Path("build/apk/export.log")
          if log.exists() and any(v in log.read_text(errors="replace") for v in values):
              log.unlink()
              print("::error title=Signing secret in the export log::removed it")
              sys.exit(1)
          print(f"export log checked for {len(values)} secret values: clean")
          PY
          echo "UPDATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$APP_VERSION"
          notes="Miner Mania 3D $APP_VERSION - signed Android APK (arm64-v8a). SHA-256: $(sha256sum "build/apk/MinerMania3D-$APP_VERSION.apk" | cut -d' ' -f1)"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "build/apk/MinerMania3D-$APP_VERSION.apk" build/apk/apk_report.json --clobber
          else
            gh release create "$tag" "build/apk/MinerMania3D-$APP_VERSION.apk" build/apk/apk_report.json \
              --title "Miner Mania 3D $APP_VERSION" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: Upload the release APK
        uses: actions/upload-artifact@v7
        with:
          name: MinerMania3D-release-apk
          path: |
            build/apk/*.apk
            build/apk/apk_report.json
            build/apk/apk_manifest.json
          if-no-files-found: error
          retention-days: 90
